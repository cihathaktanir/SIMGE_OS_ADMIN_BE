# =====================================================================
# Panel e-mail copy (English). Mirrors the storefront's messages_en.properties
# for the invitation flow; see messages.properties for why the two must match.
# =====================================================================

mail.greeting=Hello,
mail.footer=This message was sent automatically by {0}; please do not reply.

mail.invite.subject=Account invitation on behalf of {0}
mail.invite.heading=Company invitation
mail.invite.intro={0} invited you to create your {2} account on behalf of {1}. Click the button below to set up your account:
mail.invite.button=Create my account
mail.invite.fallback=If the button does not work, paste this address into your browser:
mail.invite.validity=The link is valid for {0} days and can only be used once.
mail.invite.ignore=If you were not expecting this invitation you can ignore this message; no account will be created.

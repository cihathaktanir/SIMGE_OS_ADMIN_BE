spring.application.name=simge-admin-backend

# =====================================================================
# SIMGE YÖNETİM — intranet API'si (ADR D-122)
#
# Bu servis vitrin backend'inden (SIMGE_OS_BE, port 8080) AYRI çalışır.
# İkisi SIMGE_OS_APP veritabanını paylaşır ama tabloları ayrıdır.
#
# CANLIYA ÇIKMADAN ÖNCE:
#   * Bu servisi İNTERNETE AÇMAYIN. ERP'ye yazacak olan taraf burası.
#   * Mikro bağlantısına ayrı bir MSSQL kullanıcısı verin; vitrininki
#     SELECT-only kalsın.
#   * SIMGE_COOKIE_SECURE=true (HTTPS)
#   * springdoc.api-docs.enabled=false
#
# ---------------------------------------------------------------------
# VERİTABANI KİMLİK BİLGİSİ BU DOSYAYA YAZILMAZ.
#
# Parolalar ortam değişkeninden okunuyor ve VARSAYILANI YOK: tanımlı
# değilse uygulama açılışta "Could not resolve placeholder" ile durur.
# Bu bilinçli — boş bir varsayılan, bağlantı hatasını veritabanı
# katmanına erteler ve "neden bağlanmıyor" sorusunu zorlaştırırdı.
#
# Yerelde çalıştırmak için (PowerShell):
#   $env:SIMGE_MIKRO_PASSWORD='...'; $env:SIMGE_APP_DB_PASSWORD='...'
#   .\mvnw.cmd spring-boot:run
#
# Tekrar tekrar yazmamak için: run-local.cmd.example dosyasını
# run-local.cmd olarak kopyalayıp doldurun — .gitignore onu dışarıda
# tutuyor.
# ---------------------------------------------------------------------
# =====================================================================

# --- Mikro ERP veritabanı ---
# Şu an SALT OKUNUR: repository'ler ReadOnlyRepository üzerinden türüyor,
# yazmak derleme hatası. Sınırlı yazma ileride tablo tablo açılacak.
spring.datasource.url=${SIMGE_MIKRO_URL:jdbc:sqlserver://localhost:1433;databaseName=MikroDB_V15_2021;encrypt=false}
spring.datasource.username=${SIMGE_MIKRO_USERNAME:sa}
spring.datasource.password=${SIMGE_MIKRO_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- SIMGE_OS_APP: kendi veritabanımız (okuma/yazma) ---
# Vitrinle paylaşılıyor. Bu servisin sahip olduğu tablolar:
#   SIMGE_STAFF_USER, SIMGE_STAFF_ROLE, SIMGE_STAFF_SESSION(_ATTRIBUTES)
# Şemaları src/main/resources/db/admin altındaki script'lerde.
#
# Ayrı değişken: canlıda Mikro'ya SELECT-only, buraya yazma yetkili iki
# FARKLI MSSQL kullanıcısı verilecek. Tek değişken olsaydı bu ayrım
# yapılamazdı.
simge.app-datasource.url=${SIMGE_APP_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SIMGE_OS_APP;encrypt=false}
simge.app-datasource.username=${SIMGE_APP_DB_USERNAME:sa}
simge.app-datasource.password=${SIMGE_APP_DB_PASSWORD}
simge.app-datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JSON alan adları snake_case — panel arayüzü vitrindekiyle aynı sözleşmeyi bekliyor.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Vitrin 8080'de; çakışmasın.
server.port=8081

# Spring Boot'un varsayılan "user" hesabını ve rastgele parolasını üretmesini kapat:
# kimlik doğrulamayı StaffAuthService yapıyor, form-login/basic zaten kapalı.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Oturum: sunucu tarafında, KENDİ tablosunda ---
# Vitrinin SPRING_SESSION tablosu paylaşılmıyor; iki uygulamanın oturum
# nesneleri aynı yere serileştirilirse biri diğerinin satırını okumaya çalışır.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SIMGE_STAFF_SESSION

# Cookie adı da ayrı: geliştirmede iki uygulama da localhost'ta ve aynı adı
# kullansalar biri diğerinin oturumunu ezerdi.
server.servlet.session.cookie.name=SIMGE_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SIMGE_COOKIE_SECURE:false}
# Vitrinden kısa (2 saat): panel ERP'ye yazacak ve açık kalmış bir yönetici
# oturumunun maliyeti daha yüksek.
server.servlet.session.timeout=1h

# İlk yönetici hesabı: personel tablosu BOŞSA bu kullanıcı adıyla bir ADMIN
# açılır ve geçici parolası bir kereye mahsus log'a yazılır. Parola
# yapılandırmada tutulmaz; ilk girişte değiştirilmesi zorunludur.
simge.bootstrap-admin.username=${SIMGE_ADMIN_USERNAME:admin}

# --- E-posta gönderimi ---
# Panelin gönderdiği tek e-posta: onaylanan başvuru için hesap kurma daveti.
# KİMLİK BİLGİSİ BURAYA YAZILMAZ; ortam değişkeniyle verin:
#   SIMGE_MAIL_USERNAME / SIMGE_MAIL_PASSWORD
# Kullanıcı adı boşsa gönderim kapanır, iletiler log'a yazılır ve onay ucu
# 503 mail_unavailable döner — davet gitmeden başvuru onaylanmış görünmesin.
spring.mail.host=${SIMGE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SIMGE_MAIL_PORT:587}
spring.mail.username=${SIMGE_MAIL_USERNAME:}
spring.mail.password=${SIMGE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SIMGE_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SIMGE_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

simge.mail.from=${SIMGE_MAIL_FROM:}
simge.mail.from-name=${SIMGE_MAIL_FROM_NAME:Simge Online Selling}
simge.mail.reply-to=${SIMGE_MAIL_REPLY_TO:}
simge.mail.enabled=${SIMGE_MAIL_ENABLED:true}

# Davet bağlantısı VİTRİNİ gösterir, paneli değil: daveti kabul eden kişi bir
# müşteri ve hesabını vitrinde açıyor. Panel intranette; oraya işaret eden bir
# bağlantı kimsenin açamayacağı bir adres olurdu.
simge.site-url=${SIMGE_SITE_URL:http://localhost:4200}

# E-posta metinleri messages*.properties dosyalarında. Türkçe karakter
# içerdikleri için kodlama açıkça UTF-8; varsayılan platform kodlaması
# Windows'ta cp1254 olur ve metinler bozulurdu.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Mail sağlık göstergesi KAPALI: SMTP çökse bile panel çalışmalı (yalnızca
# başvuru onayı bekler). Açık kalsaydı /actuator/health sağlıklı bir sunucuyu
# DOWN raporlar ve her sağlık kontrolü yeni bir SMTP bağlantısı açardı.
management.health.mail.enabled=false

# --- API dokümantasyonu ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
# CANLIDA KAPATIN
springdoc.api-docs.enabled=${SIMGE_API_DOCS:true}

logging.level.root=INFO
logging.level.com.simge.adminbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================================
# Panelin gönderdiği e-posta metinleri (Türkçe — varsayılan dil).
#
# Panel tek tür e-posta gönderir: onaylanan başvuru için hesap kurma
# daveti. Vitrindeki messages.properties'in ilgili anahtarlarıyla BİREBİR
# aynı olmalı — aynı kişi, kayıt akışını yarıda bıraktıysa iki farklı
# üsluptaki iletiyi arka arkaya alabiliyor.
#
# MessageFormat kuralı: kesme işareti (') tek başına kullanılamaz,
# yerine iki tane yazılır ('') — aksi halde {0} gibi yer tutucular
# SESSİZCE çalışmaz ve metinde ham "{0}" görünür. Bu yüzden konu satırı
# "Simge Online Selling'e" değil "{0} firması adına" biçiminde yazıldı.
# =====================================================================

mail.greeting=Merhaba,
mail.footer=Bu ileti {0} tarafından otomatik gönderilmiştir; yanıtlamayın.

mail.invite.subject={0} firması adına hesap daveti
mail.invite.heading=Firma daveti
mail.invite.intro={0}, {1} adına {2} hesabınızı oluşturmanız için sizi davet etti. Hesabınızı açmak için aşağıdaki düğmeye tıklayın:
mail.invite.button=Hesabımı oluştur
mail.invite.fallback=Düğme çalışmazsa bu adresi tarayıcınıza yapıştırın:
mail.invite.validity=Bağlantı {0} gün geçerlidir ve yalnızca bir kez kullanılabilir.
mail.invite.ignore=Bu daveti beklemiyorsanız bu iletiyi yok sayabilirsiniz; hesap açılmaz.
